[workspace]
resolver = "3"
members = [
  "crates/libs/styrene-entropy",
  "crates/libs/styrene-content",
  "crates/libs/styrene-telemetry",
  "crates/libs/styrene-rns",
  "crates/libs/styrene-lxmf",
  "crates/libs/styrene-mesh",
  "crates/libs/styrene-ipc",
  "crates/libs/styrene-ipc-server",
  "crates/libs/styrene-identity",
  "crates/libs/styrene-tunnel",
  "crates/libs/styrene-micron",
  "crates/libs/styrene-rbac",
  "crates/libs/styrene-secrets",
  "crates/apps/styrened",
  "crates/apps/styrene",
  "crates/apps/styrene-dx",
  "crates/apps/styrene-i2p",
  "crates/apps/styrene-tui",
  "crates/libs/styrene-services",
  "crates/libs/styrene-mqtt",
  "crates/libs/styrene-a2a",
  "crates/libs/styrene-forge",
  "crates/libs/styrene-amcp",
  "crates/tests/styrene-e2e",
  "crates/tests/styrene-interop-runner",
]
default-members = [
  "crates/libs/styrene-entropy",
  "crates/libs/styrene-content",
  "crates/libs/styrene-telemetry",
  "crates/libs/styrene-rns",
  "crates/libs/styrene-lxmf",
  "crates/libs/styrene-mesh",
  "crates/libs/styrene-ipc",
  "crates/libs/styrene-ipc-server",
  "crates/libs/styrene-identity",
  "crates/libs/styrene-tunnel",
  "crates/libs/styrene-micron",
  "crates/libs/styrene-rbac",
  "crates/libs/styrene-secrets",
  "crates/apps/styrened",
  # "crates/apps/styrene-dx",  # desktop GUI - build explicitly with -p
  "crates/apps/styrene-tui",
  "crates/libs/styrene-amcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/styrene-lab/styrene-rs"
authors = ["Styrene Labs"]

[workspace.metadata.styrene]
automated-release-crates = ["styrene-a2a", "styrene-mqtt"]
public-crates = [
  "styrene-rns",
  "styrene-lxmf",
  "styrene-mesh",
  "styrene-ipc",
  "styrene-ipc-server",
  "styrene-identity",
  "styrene-tunnel",
  "styrene-secrets",
  "styrene-a2a",
  "styrene-mqtt",
  "styrene-forge",
]

[workspace.metadata.styrene.layers]
foundation = [
  "styrene-entropy",
  "styrene-content",
  "styrene-telemetry",
  "styrene-rns",
  "styrene-micron",
]
protocol = ["styrene-lxmf", "styrene-mesh", "styrene-tunnel"]
domain = [
  "styrene-identity",
  "styrene-rbac",
  "styrene-secrets",
  "styrene-services",
  "styrene-a2a",
  "styrene-mqtt",
  "styrene-forge",
  "styrene-amcp",
]
interface = ["styrene-ipc", "styrene-ipc-server"]
runtime = ["styrened"]
application = ["styrene", "styrene-dx", "styrene-i2p", "styrene-tui"]
tooling = ["styrene-interop-runner"]
test = ["styrene-e2e"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5.29", features = ["derive"] }
clap_complete = "4.5"
criterion = "0.5"
styrene-entropy = { version = "0.1.0", path = "crates/libs/styrene-entropy" }
styrene-lxmf = { version = "0.1.1", path = "crates/libs/styrene-lxmf" }
styrene-rns = { version = "0.1.0", path = "crates/libs/styrene-rns" }
styrene-mesh = { version = "0.1.0", path = "crates/libs/styrene-mesh" }
styrene-ipc = { version = "0.1.0", path = "crates/libs/styrene-ipc" }
styrene-ipc-server = { version = "0.1.0", path = "crates/libs/styrene-ipc-server" }
styrene-tunnel = { version = "0.1.0", path = "crates/libs/styrene-tunnel" }
styrene-micron = { version = "0.1.0", path = "crates/libs/styrene-micron" }
styrene-rbac = { version = "0.1.0", path = "crates/libs/styrene-rbac" }
styrene-secrets = { version = "0.1.1", path = "crates/libs/styrene-secrets" }
aes = "0.8.4"
aes-gcm = "0.10"
ml-kem = "0.2.3"
base64 = "0.22"
cbc = "0.1.2"
crypto-common = "0.1.6"
ed25519-dalek = "=2.1.1"
hkdf = "0.12.4"
hmac = "0.12.1"
hex = "0.4"
log = "0.4.27"
loom = "0.7"
serde_bytes = "0.11"
rmp-serde = "1.3.0"
rmpv = { version = "1.3.0", features = ["with-serde"] }
rusqlite = "0.31.0"
time = "0.3.45"
tokio-util = "0.7.15"
bzip2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
toml = "0.8"
tokio = { version = "1.44.2", features = ["full"] }
tokio-rustls = "0.26.2"
rustls = "0.23.23"
rustls-pemfile = "2.2.0"
x509-parser = "0.16.0"
rand_core = "0.6.4"
x25519-dalek = "2.0.1"
async-trait = "0.1"
thiserror = "1"
zeroize = "1.8"
tracing = "0.1"
rumqttc = "0.25"
rumqttd = "0.20"
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
pin-project-lite = "0.2"
styrene-mqtt = { version = "0.2.1", path = "crates/libs/styrene-mqtt" }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev.package.styrene-rns]
opt-level = 2

[profile.test.package.styrene-rns]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
