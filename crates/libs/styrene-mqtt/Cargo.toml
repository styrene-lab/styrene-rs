[package]
name = "styrene-mqtt"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/styrene-lab/styrene-rs"
description = "MQTT 5 bearer adapter for canonical Styrene A2A envelopes"
readme = "README.md"
keywords = ["styrene", "mqtt", "a2a", "mosquitto"]
categories = ["network-programming"]

[lib]
name = "styrene_mqtt"

[dependencies]
styrene-a2a = { path = "../styrene-a2a" }
tokio = { version = "1.44.2", features = ["sync", "rt", "macros", "time"] }
thiserror = "1"
rumqttc = "0.25"
bytes = "1"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1.44.2", features = ["full"] }
