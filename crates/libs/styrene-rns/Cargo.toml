[package]
name = "styrene-rns"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust RNS protocol core — identity, destinations, links, cryptographic primitives, and transport"
keywords = ["styrene", "reticulum", "rns", "mesh", "cryptography"]
categories = ["network-programming", "cryptography"]

[lib]
name = "rns_core"

[dependencies]
aes.workspace = true
cbc.workspace = true
crypto-common = { workspace = true, features = ["rand_core"] }
# Keep these requirements aligned with the workspace: edition 2024 cannot disable
# inherited defaults when the workspace dependency enables them.
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["alloc", "fast", "zeroize", "rand_core"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hkdf.workspace = true
hmac.workspace = true
rand_core.workspace = true
rmp-serde = { workspace = true, optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_bytes = { workspace = true, optional = true }
sha2 = { version = "0.10", default-features = false }
x25519-dalek = { workspace = true, features = ["static_secrets"] }

# Transport-only dependencies (optional, gated by "transport" feature)
bzip2 = { workspace = true, optional = true }
log = { workspace = true, optional = true }
rmpv = { workspace = true, features = ["with-serde"], optional = true }
rmp = { version = "0.8.14", optional = true }
rusqlite = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
socket2 = { version = "0.6.2", optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
tokio-util = { workspace = true, optional = true }
tokio-serial = { version = "5.4", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
styrene-interop-runner = { path = "../../tests/styrene-interop-runner" }
tokio = { workspace = true, features = ["test-util"] }

[features]
default = ["std"]
std = [
    "ed25519-dalek/std",
    "hex/std",
    "rand_core/getrandom",
    "dep:rmp-serde",
    "serde/std",
    "dep:serde_bytes",
    "sha2/std",
]
alloc = []
fernet-aes128 = []
interop-tests = ["std"]
transport = [
    "std",
    "dep:bzip2",
    "dep:log",
    "dep:rmpv",
    "dep:rmp",
    "dep:rusqlite",
    "dep:serde_json",
    "dep:socket2",
    "dep:tokio",
    "dep:tokio-util",
]
testing = ["transport"]
serial = ["transport", "dep:tokio-serial"]

[lints]
workspace = true
