[package]
name = "styrene"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Styrene mesh node — daemon, TUI, and CLI in one binary"
build = "build.rs"
publish = false

[[bin]]
name = "styrene"
path = "src/main.rs"

[dependencies]
# CLI
clap = { workspace = true, features = ["derive", "env"] }
console = "0.15"
anyhow.workspace = true

# IPC client
styrene-ipc = { path = "../../libs/styrene-ipc", version = "0.1.0" }
styrene-ipc-client = { path = "../../libs/styrene-ipc-client", version = "0.1.0" }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Daemon (feature-gated)
styrened = { path = "../styrened", version = "0.3.0", optional = true }

# TUI (feature-gated)
styrene-tui-app = { package = "styrene-tui", path = "../styrene-tui", version = "0.3.0", optional = true }

[features]
default = ["daemon", "cli", "tui"]
daemon = ["styrened"]
tui = ["daemon", "cli", "styrene-tui-app"]
cli = []

[lints]
workspace = true
