[package]
name = "styrene-dx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Styrene desktop operator console and protocol testing scaffold"
publish = false

[[bin]]
name = "styrene-dx"
path = "src/main.rs"

[dependencies]
# Dioxus core + platform renderers
dioxus = { version = "0.7", features = ["desktop"] }

# Daemon integration (hybrid: IPC socket or embedded)
styrened = { path = "../styrened" }
styrene-ipc = { path = "../../libs/styrene-ipc" }
styrene-ipc-server = { path = "../../libs/styrene-ipc-server" }
styrene-micron = { path = "../../libs/styrene-micron" }
styrene-interop-runner = { path = "../../tests/styrene-interop-runner" }

# Protocol crates
styrene-rns = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Utilities
hex.workspace = true
log.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rmpv = { workspace = true, features = ["with-serde"] }
rmp-serde.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
futures-util = "0.3"
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
