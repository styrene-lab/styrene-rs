name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo check --workspace --all-targets

  test-core:
    name: Test (Linux core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p styrene-entropy -p styrene-content -p styrene-telemetry -p styrene-rns -p styrene-lxmf -p styrene-mesh -p styrene-ipc -p styrene-identity -p styrene-tunnel -p styrene-micron -p styrene-rbac -p styrene-secrets -p styrene-services -p styrene-a2a -p styrene-mqtt -p styrene-forge -p styrene-amcp
          cargo test -p styrene-rnode-firmware
          cargo test -p styrene-ipc-server --lib --test wire_compat
          cargo test -p styrened --lib --test announce_names --test config --test identity_store --test lxmf_bridge_tests --test lxmf_fidelity_storage --test mobile_application_parity_corpus --test mobile_backend_p0_corpus --test mobile_corpus --test mobile_forced_termination --test mobile_minimum_corpus --test mobile_p0_backend --test nomadnet_pages_offline --test receipt_bridge --test receipt_mapping --test rns_crypto --test transport_contract --test transport_null --test worker_announce --test worker_inbound -- --test-threads=1
          cargo test -p styrene-e2e --test identity --test lxmf_protocol --test pqc_scenario
          cargo test -p styrene-tui --lib
          cargo test -p styrene --bin styrene

  test-macos:
    name: Test (macOS workspace)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p styrene-entropy -p styrene-content -p styrene-telemetry -p styrene-rns -p styrene-lxmf -p styrene-mesh -p styrene-ipc -p styrene-identity -p styrene-tunnel -p styrene-micron -p styrene-rbac -p styrene-secrets -p styrene-services -p styrene-a2a -p styrene-mqtt -p styrene-forge -p styrene-amcp
          cargo test -p styrene-rnode-firmware
          cargo test -p styrene-ipc-server --lib --test wire_compat
          cargo test -p styrened --lib --test announce_names --test config --test identity_store --test lxmf_bridge_tests --test lxmf_fidelity_storage --test mobile_application_parity_corpus --test mobile_backend_p0_corpus --test mobile_corpus --test mobile_forced_termination --test mobile_minimum_corpus --test mobile_p0_backend --test nomadnet_pages_offline --test receipt_bridge --test receipt_mapping --test rns_crypto --test transport_contract --test transport_null --test worker_announce --test worker_inbound -- --test-threads=1
          cargo test -p styrene-e2e --test identity --test lxmf_protocol --test pqc_scenario
          cargo test -p styrene-tui --lib
          cargo test -p styrene --bin styrene

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: |
          cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - name: Validate RNode firmware corpus
        run: |
          python3 scripts/test_validate_rnode_firmware_corpus.py
          python3 scripts/validate_rnode_firmware_corpus.py
      - name: Guard offline validation boundaries
        run: |
          mkdir -p target
          rustc --edition 2024 --test scripts/test_validation_offline.rs -o target/test-validation-offline
          target/test-validation-offline

  fixture-interop:
    name: Interop (committed fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Test committed interoperability fixtures
        run: |
          cargo test --package styrene-rns --features interop-tests,transport
          cargo test -p styrene-interop-runner --test rns_fixtures --test rns_handoff_manifests

  # Verify all backend feature profiles compile
  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "desktop (default)"
            features: ""
          - name: "mobile (minimal)"
            features: "--no-default-features"
          - name: "mobile-identity"
            features: "--no-default-features --features mobile-identity"
          - name: "terminal only"
            features: "--no-default-features --features terminal"
          - name: "ipc-server only"
            features: "--no-default-features --features ipc-server"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: "Check: ${{ matrix.name }}"
        run: cargo check -p styrened ${{ matrix.features }}
  library-minimal:
    name: Reusable Libraries (defaults disabled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo check --lib --no-default-features -p styrene-content
          cargo check --lib --no-default-features -p styrene-telemetry
          cargo test --lib --no-default-features -p styrene-lxmf
          cargo check --lib --no-default-features -p styrene-mesh
          cargo check --lib --no-default-features -p styrene-rbac
          cargo check --lib --no-default-features -p styrene-identity
          cargo check --lib --no-default-features -p styrene-secrets
