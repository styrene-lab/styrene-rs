name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Linux desktop/FFI crates link against GTK/WebKit through pkg-config.
  LINUX_DESKTOP_PACKAGES: libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --exclude styrene-dx

  desktop-linux:
    name: Desktop (Linux)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DESKTOP_PACKAGES
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p styrene-dx --all-targets

  test-core:
    name: Test (Linux core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude styrene-dx

  test-macos:
    name: Test (macOS workspace)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --exclude styrene-dx --no-deps -- -D warnings

  interop:
    name: Interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r tests/interop/python/requirements.txt
      - name: Generate test fixtures
        run: cd tests/interop/python && python3 generate_fixtures.py
      - name: Run interop tests
        run: cargo test --package styrene-rns --features interop-tests,transport

  # Verify all feature profiles compile (mobile, desktop, FFI)
  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "desktop (default)"
            features: ""
          - name: "mobile (minimal)"
            features: "--no-default-features"
          - name: "mobile-identity"
            features: "--no-default-features --features mobile-identity"
          - name: "terminal only"
            features: "--no-default-features --features terminal"
          - name: "ipc-server only"
            features: "--no-default-features --features ipc-server"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: "Check: ${{ matrix.name }}"
        run: cargo check -p styrened ${{ matrix.features }}

  # macOS-only: verify keychain feature compiles (requires security-framework)
  feature-keychain:
    name: Feature Matrix (keychain)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: "Check: mobile-keychain"
        run: cargo check -p styrened --no-default-features --features mobile-keychain

  # UniFFI bridge compilation
  ffi-bridge:
    name: FFI Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p styrene-mobile-ffi

  # E2E integration tests
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p styrene-e2e

  lipstyk:
    name: lipstyk
    uses: styrene-lab/lipstyk/.github/workflows/lipstyk.yml@main
    with:
      paths: "crates/"
      threshold: 50
