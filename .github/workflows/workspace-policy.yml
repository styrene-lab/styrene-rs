name: Workspace policy

# Repository-structure policy is separate from ordinary Rust-only validation.
# validation-class: repository-policy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  policy:
    name: Crate boundaries and publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Test policy checker
        run: python3 scripts/test_check_workspace_policy.py
      - name: Enforce workspace policy
        run: python3 scripts/check_workspace_policy.py
