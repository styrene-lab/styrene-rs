name: Live Interoperability

# Pinned Python/Rust LXMF gates. One dispatch runs every scenario and retains
# structured evidence per scenario. Repository policy keeps live Python runs
# manual: ordinary validation stays offline and scheduled workflows stay
# fixture-only.
on:
  workflow_dispatch:

jobs:
  live-interop:
    name: Live ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - direct
          - direct_resource
          - opportunistic
          - propagated_resource_lxm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install native and Python support dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
          pip install -r tests/interop/python/requirements.txt
      - uses: actions/checkout@v5
        with:
          repository: markqvist/Reticulum
          ref: b48b96e61676504e0a4e527b33b9a0b4495c6872
          path: .live-upstream/Reticulum
      - uses: actions/checkout@v5
        with:
          repository: markqvist/LXMF
          ref: 795fdaa2b0777c13033787d933d1afc94a2377cb
          path: .live-upstream/LXMF
      - name: Run supervised live scenario
        env:
          PYTHONPATH: ${{ github.workspace }}/.live-upstream/Reticulum:${{ github.workspace }}/.live-upstream/LXMF
          LXMF_PYTHON_BIN: python3
        run: >-
          cargo run -p styrene-interop-runner --bin styrene-interop --
          "${{ matrix.scenario }}"
          --timeout 300
          --evidence "target/interop/live-${{ matrix.scenario }}.json"
      - name: Retain structured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-interop-${{ matrix.scenario }}
          path: target/interop/
          if-no-files-found: warn
